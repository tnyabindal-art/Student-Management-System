<h2>Student List</h2>

<table border="1">
  <tr>
    <th>name</th>
    <th>email</th>
    <th>phone</th>
    <th>course</th>
  </tr>

  <tr *ngFor="let student of students">
    <td>{{student.name}}</td>
    <td>{{student.email}}</td>
    <td>{{student.phone}}</td>
    <td>{{student.course}}</td>
    <td>
      <button (click)="editstudent(student)">Edit</button>
       <button (click)="deleteStudent(student.id)">Delete</button>
    </td>
  </tr>
</table>

   
 <div *ngIf="selectedStudent">
  <h3> Update Student </h3>

  <label>Name:</label><br>
  <input [(ngModel)]="selectedStudent.name" name="name"><br><br>

  <label>Email:</label><br>
  <input [(ngModel)]="selectedStudent.email" name="email"><br><br>

  <label>Phone:</label><br>
  <input [(ngModel)]="selectedStudent.phone" name="phone"><br><br>

  <label>Course:</label><br>
  <input [(ngModel)]="selectedStudent.course" name="course"><br><br>

  <button (click)="updatestudent()">Update</button>
  <button (click)="selectedStudent = null">Cancel</button>
 
 </div>
