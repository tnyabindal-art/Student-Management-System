<h2>Add Student</h2>
<form (ngSubmit)="onSubmit()">

    <label>Name:</label>
    <input type="text" [(ngModel)]="student.name" 
    name="name" required><br><br>

     <label>Email:</label>
     <input type="text"[(ngModel)]="student.email"
     name="email" required><br><br>

      <label>Phone:</label>
     <input type="text"[(ngModel)]="student.phone"
     name="phone" required><br><br>

      <label>Course:</label>
     <input type="text"[(ngModel)]="student.course"
     name="course" required><br><br>

     <button type="submit">Add Student</button>
     </form>
